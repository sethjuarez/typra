blank_issues_enabled: true
contact_links:
  - name: Emitter capability boundary
    url: https://typra.dev/concepts/emitter-boundary/
    about: >
      Decide whether a request is schema projection, a mixed generated seam, internal emitter infrastructure,
      or a consumer-owned algorithm before filing an implementation issue.
  - name: Design ruling / usage question
    url: https://github.com/sethjuarez/typra/discussions
    about: >
      Not sure whether a diagnostic or restriction is intended? Ask for a maintainer ruling in Discussions
      before filing a bug — some tightenings are principled and the answer may be "conform to the pattern."
